
spring.application.name=lifelink

server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lifelink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.serialization.fail-on-empty-beans=false

# Session cookie for HTTPS frontend/backend communication
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
```

Do not overwrite your working database URL or passwords with example credentials. Set the actual values in Render's environment variables.

## 4. `app.js`

Location: the same frontend folder as `dashboard.html` and `index.html`.

This version includes login, dashboard loading, session testing, and logout. It also prints useful errors in the browser Console.

<CodeBlock language="javascript" editable>
"use strict";

const API = "https://lifelink-fullstack-java07.onrender.com/api";

// Send requests to the Java backend.
async function apiRequest(endpoint, options = {}) {
    const response = await fetch(`${API}${endpoint}`, {
        ...options,
        credentials: "include",
        headers: {
            ...(options.body
                ? { "Content-Type": "application/json" }
                : {}),
            ...options.headers
        }
    });

    const text = await response.text();
    let data = {};

    if (text) {
        try {
            data = JSON.parse(text);
        } catch {
            data = { message: text };
        }
    }

    if (!response.ok) {
        throw new Error(
            data.message ||
            data.error ||
            `HTTP ${response.status}`
        );
    }

    return data;
}

// Display login errors.
function showError(element, message) {
    if (!element) {
        console.error(message);
        return;
    }

    element.textContent = message;
    element.classList.remove("hidden");
}

// Login.
async function login() {
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const errorBox = document.getElementById("error");
    const loginButton = document.getElementById("loginButton");

    if (!usernameInput || !passwordInput || !errorBox) {
        console.error("Login form elements are missing.");
        return;
    }

    errorBox.textContent = "";
    errorBox.classList.add("hidden");

    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    const roleInput = document.querySelector(
        'input[name="role"]:checked'
    );

    if (!roleInput) {
        showError(errorBox, "Please select a role.");
        return;
    }

    if (!username || !password) {
        showError(errorBox, "Please enter username and password.");
        return;
    }

    if (loginButton) {
        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";
    }

    try {
        const data = await apiRequest("/login", {
            method: "POST",
            body: JSON.stringify({
                username,
                password,
                role: roleInput.value
            })
        });

        sessionStorage.setItem("loggedIn", "1");
        sessionStorage.setItem(
            "username",
            data.username || username
        );
        sessionStorage.setItem(
            "role",
            data.role || roleInput.value
        );

        window.location.href = "dashboard.html";

    } catch (error) {
        console.error("Login failed:", error);
        showError(errorBox, error.message);

    } finally {
        if (loginButton) {
            loginButton.disabled = false;
            loginButton.textContent = "Login";
        }
    }
}

// Test whether the backend recognizes the session.
async function checkSession() {
    return await apiRequest("/session", {
        method: "GET"
    });
}

// Load dashboard.
async function loadDashboard() {
    const username =
        sessionStorage.getItem("username") || "Demo User";

    const role =
        sessionStorage.getItem("role") || "USER";

    const topUser = document.getElementById("topUser");
    const profile = document.getElementById("profile");

    if (topUser) {
        topUser.replaceChildren();

        const name = document.createElement("span");
        name.textContent = username + " ";

        const button = document.createElement("button");
        button.type = "button";
        button.className = "linkbtn";
        button.textContent = "Logout";
        button.addEventListener("click", logout);

        topUser.append(name, button);
    }

    if (profile) {
        profile.textContent =
            `Username: ${username} | Role: ${role}`;
    }

    try {
        // First check whether the backend recognizes the session.
        const session = await checkSession();
        console.log("Authenticated session:", session);

        // Then request the dashboard data.
        const data = await apiRequest("/dashboard", {
            method: "GET"
        });

        console.log("Dashboard API response:", data);

        const organs = document.getElementById("organsCount");
        const hospitals = document.getElementById("hospitalCount");
        const requests = document.getElementById("requestCount");

        if (organs) {
            organs.textContent =
                data.availableOrgans ??
                data.organsCount ??
                data.availableOrganCount ??
                0;
        }

        if (hospitals) {
            hospitals.textContent =
                data.registeredHospitals ??
                data.hospitalCount ??
                data.totalHospitals ??
                0;
        }

        if (requests) {
            requests.textContent =
                data.myRequests ??
                data.requestCount ??
                data.totalRequests ??
                0;
        }

    } catch (error) {
        console.error("Dashboard error:", error);

        if (profile) {
            profile.textContent =
                "Dashboard error: " + error.message;
        }
    }
}

// Logout.
async function logout() {
    try {
        await apiRequest("/logout", {
            method: "POST"
        });
    } catch (error) {
        console.error("Logout error:", error);
    } finally {
        sessionStorage.clear();
        window.location.href = "index.html";
    }
}

// Support login forms.
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("loginForm");

    if (form) {
        form.addEventListener("submit", event => {
            event.preventDefault();
            login();
        });
    }
});
